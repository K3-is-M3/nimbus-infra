apiVersion: v1
kind: Service
metadata: 
  name: nimbus-website
  labels:
    app: nimbus-website
spec:
  type: LoadBalancer  #aks will allocate public IP
  selector:
    app: nimbus-website
  ports:
    - name: https
      port: 80          #svc port exposed to internet
      targetPort: 80    #port tht container listen on